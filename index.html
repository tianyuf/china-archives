<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>China Archives · 中国档案馆开放目录</title>
<style>
  :root{
    --ink:#18181b; --text:#27272a; --muted:#71717a; --faint:#a1a1aa;
    --line:#e4e4e7; --line-strong:#d4d4d8; --bg:#ffffff; --subtle:#fafafa; --hover:#f4f4f5;
    --accent:#1d4ed8; --accent-dark:#1e3a8a; --top:#18181b; --top-h:44px;
    --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans)}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-dark);text-decoration:underline}
  .top{position:sticky;top:0;height:var(--top-h);display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--top);color:#e4e4e7}
  .brand{color:#fafafa;font-weight:600;font-size:14px;letter-spacing:-.01em}
  .brand:hover{color:#fff;text-decoration:none}
  main{max-width:1000px;margin:0 auto;padding:28px 28px 60px}
  .page-head{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.01em}
  .subtitle{margin:0;font-size:13px;color:var(--muted)}
  .lede{margin:10px 0 22px;font-size:14px;color:var(--text);max-width:72ch}
  .list{border-top:1px solid var(--ink)}
  .item{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding:13px 12px;border-bottom:1px solid var(--line)}
  .item:hover{background:var(--subtle)}
  .item .name{font-size:15px;font-weight:600}
  .item .desc{color:var(--muted);font-size:13px}
  .item .meta{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
  .foot{margin-top:24px;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<header class="top">
  <span class="brand">china-archives</span>
</header>
<main>
  <div class="page-head">
    <h1>中国档案馆开放目录</h1>
    <p class="subtitle">China open archive catalogs — 检索 · 排序 · 离线可用</p>
  </div>
  <p class="lede">各市档案馆公开的开放档案目录，整理为可离线检索、排序的单页应用（HTML 内嵌数据，无需联网）。每个目录同时提供原始 CSV。</p>

  <div class="list">
    <a class="item" href="nanchang/">
      <span class="name">南昌市档案馆</span>
      <span class="desc">开放档案目录 · 2000年（含）前</span>
      <span class="meta">89,879 条</span>
    </a>
  </div>

  <p class="foot">数据来源：各馆公开目录 · 页面与字体遵循 SIL OFL 许可（见 nanchang/fonts/OFL.txt）</p>
</main>
</body>
</html>
